{% extends "base.html" %}
{% block title %}{{ symbol }} · Charts · {{ org }}{% endblock %}
{% block wrapclass %} wide{% endblock %}
{% block content %}
<div class="eyebrow">Lab</div>
<div class="toolbar" style="margin-top:4px">
  <form id="sym-form" class="toolbar" style="margin:0">
    <input type="text" id="sym-input" value="{{ symbol }}" placeholder="Ticker" style="width:130px;font-family:var(--mono);font-weight:600;text-transform:uppercase">
    <button class="btn sm primary" type="submit">Go</button>
  </form>
  <div class="tabs" id="sym-range">
    <button type="button" data-mode="today" title="The latest session, minute by minute">Today</button>
    <button type="button" data-years="1">1Y</button><button type="button" data-years="3">3Y</button>
    <button type="button" data-years="5" aria-selected="true">5Y</button><button type="button" data-years="10">10Y</button>
    <button type="button" data-years="0">Max</button>
  </div>
  <span class="spacer"></span>
  <button class="btn sm quiet" type="button" id="sym-refresh" title="Pull the latest bars and quote from the data vendor now">Refresh</button>
  <a class="btn sm quiet" id="sym-play" href="/lab/play?strategy=vix_vote&asset={{ symbol }}">Run a dial on {{ symbol }} →</a>
</div>
<div id="chart-root" data-symbol="{{ symbol }}" data-today="{{ today }}">
  <h1 id="sym-title">{{ symbol }}</h1>
  <div class="notice"><span class="spin"></span> &nbsp;Loading bars.</div>
</div>
{% endblock %}
{% block scripts %}
<script src="https://unpkg.com/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js"></script>
<script src="/static/lab.js"></script>
<script>EHF.symbolPage(document.getElementById('chart-root'));</script>
{% endblock %}
