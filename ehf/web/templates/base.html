<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ org }}{% endblock %}</title>
<meta name="robots" content="noindex, nofollow">
<script>(function(){var t=null;try{t=new URLSearchParams(location.search).get('theme')||localStorage.getItem('ehf-theme');}catch(e){}if(t==='light'||t==='dark'){document.documentElement.dataset.theme=t;}})();</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%235eead4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="/static/site.css">
{% block head %}{% endblock %}
</head>
<body>
<div class="wrap{% block wrapclass %}{% endblock %}">
<nav class="top">
  <a class="brand" href="/"><span class="dot"></span>{{ org }}</a>
  <a class="link{% if path.startswith('/library') %} active{% endif %}" href="/library">Library</a>
  <a class="link{% if path.startswith('/daily') %} active{% endif %}" href="/daily">Daily report</a>
  {% if lab %}
  <a class="link{% if path == '/lab' or path == '/lab/' or path.startswith('/lab/run') %} active{% endif %}" href="/lab">Backtests</a>
  <a class="link{% if path.startswith('/lab/play') %} active{% endif %}" href="/lab/play">Playground</a>
  <a class="link{% if path.startswith('/lab/chart') %} active{% endif %}" href="/lab/chart">Charts</a>
  {% endif %}
  <span class="spacer"></span>
  {% if user %}<span class="who">{{ user.display }}</span>{% endif %}
  <button class="icon-btn" id="theme-toggle" type="button" title="Toggle light / dark" aria-label="Toggle light or dark theme">
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
  <a class="link" href="/logout">Sign out</a>
</nav>
{% block content %}{% endblock %}
<footer>{{ org }} &middot; private research library &middot; not investment advice</footer>
</div>
<script>
(function(){
  var b=document.getElementById('theme-toggle');
  function cur(){var t=document.documentElement.dataset.theme;if(t)return t;return matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}
  b.addEventListener('click',function(){var n=cur()==='dark'?'light':'dark';document.documentElement.dataset.theme=n;
    try{localStorage.setItem('ehf-theme',n);}catch(e){}document.dispatchEvent(new CustomEvent('ehf:theme',{detail:n}));});
})();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
