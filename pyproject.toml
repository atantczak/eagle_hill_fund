[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ehf"
version = "0.1.0"
description = "Eagle Hill Fund research & trading platform (data, signals, backtest, results, analysis)."
authors = [{ name = "Andrew Antczak" }]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",      # robustness stats (PSR/DSR normal CDF/PPF)
    "matplotlib>=3.8",  # tearsheets
    "pyarrow>=14",      # parquet: data cache + results store
    "pydantic>=2.5",    # typed, hashable run specs
    "python-dotenv>=1.0",
    "requests>=2.31",      # used by the wrapped FMP tooling
    "requests-mock>=1.11", # legacy APIClient imports it at module load
    "psutil>=5.9",         # used by the wrapped ParallelizationTool
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "mypy>=1.9", "pandas-stubs", "types-requests", "pre-commit>=3.6"]

# One package: `ehf`. The quant platform lives in `ehf.server.research`; the
# legacy FMP/AWS tooling it wraps lives in `ehf.server.{integrations,tools}`.
[tool.setuptools.packages.find]
include = ["ehf*"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["ehf/server/research", "tests"]
force-exclude = true
# Lint/format only the platform + tests. The legacy server code and the client
# placeholder are kept as-is and excluded from the modern toolchain.
extend-exclude = ["ehf/server/integrations", "ehf/server/tools", "ehf/client"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PD"]
# PD008/PD010 are opinionated: `.at` is the correct fast scalar accessor and
# `.pivot` is correct on guaranteed-unique keys (validate_bars dedups).
ignore = ["PD008", "PD010"]

[tool.mypy]
python_version = "3.11"
files = ["ehf/server/research"]
strict = true
# The legacy server tooling is untyped code we only touch at the data adapter.
[[tool.mypy.overrides]]
module = ["ehf.server.integrations.*", "ehf.server.tools.*", "ehf.client.*"]
ignore_missing_imports = true
follow_imports = "skip"

# scipy ships no type stubs.
[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
